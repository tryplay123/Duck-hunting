<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة منصة المغامرات المتجاوبة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        #game-container {
            position: relative;
            background: #4FC3F7;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        /* Mobile Touch Controls */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 0 40px;
            pointer-events: auto;
        }
        .control-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid white;
            color: white;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            outline: none;
            transition: transform 0.1s;
        }
        .control-btn:active {
            transform: scale(0.9);
            background: rgba(46, 125, 50, 0.8);
        }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 10px;">🎮 منصة الألعاب الخاصة بك (نسخة الويب التجريبية)</h2>
    <p style="margin-top: 0; color: #aaa; font-size: 14px;">تعمل مباشرة على الآيفون، الأندرويد، والكمبيوتر بدون تحميل</p>

    <div id="game-container">
        <div class="ui-overlay">
            <div id="score-container">🏆 النقاط: <span id="score-val">0</span></div>
            <div id="level-container">المستوى: <span id="level-val">1</span></div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <!-- أزرار لمس للهواتف والتابلت -->
        <div id="controls">
            <button class="control-btn" id="left-btn">◀</button>
            <button class="control-btn" id="jump-btn">🔺</button>
            <button class="control-btn" id="right-btn">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // أحجام وبيانات اللعبة
        const game = {
            width: 800,
            height: 450,
            gravity: 0.6,
            score: 0,
            level: 1
        };

        // بطل اللعبة الأنيق وتفاصيله (مطابق تماماً لمظهر الأندرويد)
        const player = {
            x: 100,
            y: 300,
            vx: 0,
            vy: 0,
            width: 40,
            height: 80,
            grounded: false,
            jumpForce: -13,
            speed: 5,
            walkFrame: 0,
            isMoving: false
        };

        // عوائق للتفادي
        let obstacles = [];
        let obstacleTimer = 0;

        // تتبع الأزرار المضغوطة
        const keys = {};

        // مستمعات الكمبيوتر (لوحة المفاتيح)
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // مستمعات شاشة اللمس (الهاتف والآيفون)
        const setupMobileControls = () => {
            const leftBtn = document.getElementById('left-btn');
            const rightBtn = document.getElementById('right-btn');
            const jumpBtn = document.getElementById('jump-btn');

            leftBtn.ontouchstart = () => keys['ArrowLeft'] = true;
            leftBtn.ontouchend = () => keys['ArrowLeft'] = false;

            rightBtn.ontouchstart = () => keys['ArrowRight'] = true;
            rightBtn.ontouchend = () => keys['ArrowRight'] = false;

            jumpBtn.ontouchstart = () => {
                if (player.grounded) {
                    player.vy = player.jumpForce;
                    player.grounded = false;
                }
            };
        };
        setupMobileControls();

        // دالة رسم البطل الأنيق (الحذاء الرياضي الأبيض، الشورت البيج، القميص الأحمر الهينلي، الشعر الأسود الكثيف)
        function drawPlayer(x, y) {
            const rx = x + 20; // نقطة المركز الأفقي للبطل
            
            // فيزياء حركة البطل في المشي (لتحريك الذراعين والقدمين)
            const legMovement = player.isMoving ? Math.sin(player.walkFrame * 0.3) * 8 : 0;
            const armSwing = player.isMoving ? Math.sin(player.walkFrame * 0.3) * 6 : 0;
            
            const headY = y + 10;
            const headRadius = 12;

            // 1. رسم الأرجل والجلد والحذاء الرياضي الأبيض (White Sneakers)
            ctx.fillStyle = "#F5CBA7"; // لون البشرة
            ctx.fillRect(rx - 10, y + 55, 5, 12); // الساق الأولى
            ctx.fillRect(rx + 5, y + 55, 5, 12);  // الساق الثانية

            // الحذاء الرياضي الأبيض الأنيق مع تفاصيل ستايلش سوداء
            ctx.fillStyle = "#FFFFFF"; 
            ctx.beginPath();
            ctx.roundRect(rx - 14 + legMovement, y + 65, 14, 10, 3);
            ctx.roundRect(rx + 2 - legMovement, y + 65, 14, 10, 3);
            ctx.fill();

            ctx.fillStyle = "#212121"; // خطوط رياضية سوداء على الحذاء
            ctx.fillRect(rx - 10 + legMovement, y + 65, 5, 3);
            ctx.fillRect(rx + 6 - legMovement, y + 65, 5, 3);

            // 2. رسم الشورت البيج الراقص (Beige Shorts)
            ctx.fillStyle = "#E6D7C3";
            ctx.beginPath();
            ctx.roundRect(rx - 13, y + 42, 26, 15, 3);
            ctx.fill();
            ctx.fillRect(rx - 13, y + 50, 10, 8);
            ctx.fillRect(rx + 3, y + 50, 10, 8);

            // 3. رسم التيشرت الأحمر الهينلي (Red Henley T-Shirt with buttons)
            ctx.fillStyle = "#E53935"; // أحمر مشرق
            ctx.beginPath();
            ctx.roundRect(rx - 15, headY + 12, 30, 22, 4);
            ctx.fill();
            ctx.fillStyle = "#D32F2F"; // الأكمام الحمراء الداكنة
            ctx.fillRect(rx - 19, headY + 14, 5, 10);
            ctx.fillRect(rx + 14, headY + 14, 5, 10);

            // ياقة الزرار الهينلي والأزرار الدقيقة
            ctx.fillStyle = "#C62828";
            ctx.fillRect(rx - 2, headY + 12, 4, 8);
            ctx.fillStyle = "#FFFFFF"; // أزرار بيضاء أنيقة وصغيرة
            ctx.beginPath();
            ctx.arc(rx, headY + 15, 1, 0, Math.PI * 2);
            ctx.arc(rx, headY + 18, 1, 0, Math.PI * 2);
            ctx.fill();

            // 4. رسم الأذرع واليدين المتأرجحة
            ctx.fillStyle = "#F5CBA7";
            ctx.fillRect(rx - 19, headY + 23, 4, 10 + armSwing);
            ctx.fillRect(rx + 15, headY + 23, 4, 10 - armSwing);

            // 5. رسم الشعر الأسود الكثيف الأنيق (Stylish Jet Black Hair)
            ctx.fillStyle = "#151515";
            ctx.beginPath();
            ctx.arc(rx, headY - 3, headRadius + 1, 0, Math.PI * 2);
            ctx.fill();

            // 6. رسم الرأس والوجه والأذنين لـ Cute Boy
            ctx.fillStyle = "#F5CBA7";
            ctx.beginPath();
            ctx.arc(rx, headY, headRadius, 0, Math.PI * 2);
            ctx.fill();
            // أذنين لطيفتين
            ctx.beginPath();
            ctx.arc(rx - headRadius, headY, 2, 0, Math.PI * 2);
            ctx.arc(rx + headRadius, headY, 2, 0, Math.PI * 2);
            ctx.fill();

            // 7. عينين سوداوين تلمعان بجمال كبير والبريق الأبيض
            const eyeLevelY = headY - 1;
            const eyeSpacing = 5;
            // العين اليسرى واليمنى والبريق الأبيض اللطيف
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.arc(rx - eyeSpacing, eyeLevelY, 3.5, 0, Math.PI * 2);
            ctx.arc(rx + eyeSpacing, eyeLevelY, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#1E1E1E";
            ctx.beginPath();
            ctx.arc(rx - eyeSpacing + 0.3, eyeLevelY, 2.4, 0, Math.PI * 2);
            ctx.arc(rx + eyeSpacing + 0.3, eyeLevelY, 2.4, 0, Math.PI * 2);
            ctx.fill();
            // بريق العين المشرق والمنعكس اللطيف
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.arc(rx - eyeSpacing - 0.7, eyeLevelY - 0.7, 0.9, 0, Math.PI * 2);
            ctx.arc(rx + eyeSpacing - 0.7, eyeLevelY - 0.7, 0.9, 0, Math.PI * 2);
            ctx.fill();

            // 8. رسم حواجب سوداء أنيقة ومنظمة وثقة عالية
            ctx.strokeStyle = "#111111";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(rx - eyeSpacing - 3, eyeLevelY - 5);
            ctx.lineTo(rx - eyeSpacing + 2, eyeLevelY - 6);
            ctx.moveTo(rx + eyeSpacing + 3, eyeLevelY - 5);
            ctx.lineTo(rx + eyeSpacing - 2, eyeLevelY - 6);
            ctx.stroke();

            // 9. فم سعيد ومبتسم أحمر لطيف جداً
            ctx.strokeStyle = "#E53935";
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.arc(rx, headY + 3, 4, 0, Math.PI);
            ctx.stroke();
        }

        // تحديث منطق الحركة واللعب
        function update() {
            // معالجة لوحة المفاتيح والتحكم
            player.isMoving = false;
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -player.speed;
                player.isMoving = true;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = player.speed;
                player.isMoving = true;
            } else {
                player.vx = 0;
            }

            if ((keys['ArrowUp'] || keys['Space'] || keys['KeyW']) && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
            }

            // تطبيق الجاذبية والسرعات والرياح
            player.vy += game.gravity;
            player.x += player.vx;
            player.y += player.vy;

            if (player.isMoving) {
                player.walkFrame++;
            }

            // حدود شاشة اللعبة والأرضية الصلبة بالأسفل
            const groundY = game.height - 100;
            if (player.y >= groundY - player.height) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.grounded = true;
            }

            if (player.x < 0) player.x = 0;
            if (player.x > game.width - player.width) player.x = game.width - player.width;

            // توليد العوائق تلقائياً بشكل عشوائي تدريجي
            obstacleTimer++;
            if (obstacleTimer % (100 - Math.min(game.level * 5, 40)) === 0) {
                obstacles.push({
                    x: game.width,
                    y: groundY - 30,
                    width: 30,
                    height: 30,
                    speed: 4 + game.level * 0.5
                });
            }

            // تحريك وتحديث العوائق وفحص التصادمات والنقاط
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacles[i].speed;

                // رصد الاصطدامات وتدمير البطل
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    // إعادة ضبط اللعبة والخسارة
                    game.score = 0;
                    game.level = 1;
                    obstacles = [];
                    player.x = 100;
                    document.getElementById('score-val').innerText = game.score;
                    document.getElementById('level-val').innerText = game.level;
                    alert("💥 اصطدمت بالعقبة! أعد المحاولة مجدداً.");
                    break;
                }

                // تجاوز العائق بسلام (زيادة النقاط والمستويات بالتسلسل)
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    game.score += 10;
                    document.getElementById('score-val').innerText = game.score;
                    
                    if (game.score % 50 === 0) {
                        game.level++;
                        document.getElementById('level-val').innerText = game.level;
                    }
                }
            }
        }

        // دالة رسم بيئة اللعبة والمنظر الطبيعي بالخلفية
        function draw() {
            // تنظيف الإطار القديم
            ctx.clearRect(0, 0, game.width, game.height);

            // 1. رسم السماء ومستدرجات الألوان الصافية والجميلة
            const grad = ctx.createLinearGradient(0, 0, 0, game.height);
            grad.addColorStop(0, '#4FC3F7');
            grad.addColorStop(1, '#E1F5FE');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, game.width, game.height);

            // 2. تلال جبلية ناعمة باللون الأخضر الجميل في الخلفية
            ctx.fillStyle = "rgba(46, 125, 50, 0.4)";
            ctx.beginPath();
            ctx.arc(200, 350, 180, 0, Math.PI * 2);
            ctx.arc(600, 380, 220, 0, Math.PI * 2);
            ctx.fill();

            // 3. رسم الأرضية العشبية الصلبة في الأسفل
            const groundY = game.height - 100;
            ctx.fillStyle = "#81C784"; // العشب
            ctx.fillRect(0, groundY, game.width, 15);
            ctx.fillStyle = "#8D6E63"; // طبقة التربة الأرضية
            ctx.fillRect(0, groundY + 15, game.width, 85);

            // 4. رسم العوائق الحالية المهددة بالخطر (طاقة الصخور البركانية الحمراء المبرزة)
            ctx.fillStyle = "#E64A19";
            obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 4);
                ctx.fill();
                // تفاصيل الصخرية البركانية المشتعلة
                ctx.fillStyle = "#FFCC80";
                ctx.fillRect(obs.x + 5, obs.y + 5, obs.width - 10, 5);
                ctx.fillStyle = "#E64A19";
            });

            // 5. استدعاء البطل الأنيق في الإحداثيات المحدثة لحضرته
            drawPlayer(player.x, player.y);
        }

        // حلقة اللعب اللانهائية (60 إطار في الثانية)
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // انطلاق اللعبة فوراً
        gameLoop();
    </script>
</body>
</html>
