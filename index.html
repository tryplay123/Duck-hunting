<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>منصة مغامرات صيد البط | 15 مستوًى متكاملاً</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --secondary: #ffb300;
            --bg-dark: #121212;
            --text-light: #f5f5f5;
            --card-bg: rgba(30, 30, 30, 0.95);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-light);
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
        }

        canvas {
            background-color: #151515;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9;
        }

        /* أزرار التحكم باللمس للشاشات الذكية (تظهر تلقائياً على الهواتف) */
        .touch-controls {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .d-pad, .action-pad {
            display: flex;
            gap: 16px;
            pointer-events: auto;
        }

        .ctrl-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 24px;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .ctrl-btn:active {
            transform: scale(0.9);
            background: rgba(46, 125, 50, 0.6);
            border-color: #ffb300;
        }

        /* تحذير تدوير الهاتف للشاشات العمودية */
        #orientation-warning {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #orientation-warning p {
            font-size: 20px;
            color: var(--secondary);
            font-weight: bold;
        }

        @media screen and (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- لوحة عرض اللعبة -->
        <canvas id="gameCanvas" width="1000" height="600"></canvas>

        <!-- واجهة لمس الهاتف -->
        <div id="touch-controls" class="touch-controls">
            <div class="d-pad">
                <div id="btn-left" class="ctrl-btn">➡</div>
                <div id="btn-right" class="ctrl-btn">⬅</div>
            </div>
            <div class="action-pad">
                <div id="btn-shoot" class="ctrl-btn" style="background: rgba(211,47,47,0.4);">🎯</div>
                <div id="btn-jump" class="ctrl-btn">⇧</div>
            </div>
        </div>

        <!-- تحذير تدوير الهاتف -->
        <div id="orientation-warning">
            <div style="font-size: 50px;">📱🔄</div>
            <p>الرجاء تدوير الهاتف للوضع الأفقي للاستمتاع باللعبة بأفضل دقة!</p>
        </div>
    </div>

    <script>
        /*******************************************************************************
         * محرك المحاكاة الصوتي للويب (Web Audio API - يعمل أوفلاين بالكامل بصيغة ويف برمجية)
         *******************************************************************************/
        class WebAudioSynth {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (this.ctx) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                } catch (e) {
                    console.error("Web Audio API not supported", e);
                }
            }

            playCoin() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now);
                osc.frequency.setValueAtTime(1318.51, now + 0.08);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.12, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            playJump() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(520, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            }

            playShoot() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.15;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1000, now);
                filter.frequency.exponentialRampToValueAtTime(150, now + 0.15);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
                noise.stop(now + 0.16);
            }

            playExplosion() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.35;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(300, now);
                filter.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
                noise.stop(now + 0.32);
            }

            playFail() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [329.63, 293.66, 261.63, 196.00];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + i * 0.12);
                    gain.gain.setValueAtTime(0, now + i * 0.12);
                    gain.gain.linearRampToValueAtTime(0.08, now + i * 0.12 + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.16);
                });
            }

            playSuccess() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.1);
                    gain.gain.setValueAtTime(0, now + i * 0.1);
                    gain.gain.linearRampToValueAtTime(0.1, now + i * 0.1 + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.1 + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.1);
                    osc.stop(now + i * 0.1 + 0.2);
                });
            }
        }

        const sound = new WebAudioSynth();

        /*******************************************************************************
         * إعدادات ومصفوفة مستويات اللعبة الـ 15 المتكاملة
         *******************************************************************************/
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let screenWidth = 1000;
        let screenHeight = 600;

        const GamePhase = {
            MENU: "MENU",
            PLATFORMER: "PLATFORMER",
            FLAG_TRANSITION: "FLAG_TRANSITION",
            HUNTING: "HUNTING",
            SUCCESS: "SUCCESS",
            FAILED: "FAILED"
        };

        const LevelTheme = {
            DAY: "DAY",
            SUNRISE: "SUNRISE",
            SUNSET: "SUNSET",
            TWILIGHT: "TWILIGHT",
            AURORA: "AURORA"
        };

        const DuckType = {
            MALLARD: { color: "#2e7d32", bodyColor: "#6d4c41", wingColor: "#1565c0", speedMult: 1.0, pts: 100, name: "كلاسيك" }, 
            GOLDEN: { color: "#ffb300", bodyColor: "#ffca28", wingColor: "#ffe082", speedMult: 1.6, pts: 500, name: "ذهبية" },
            SWIFT: { color: "#ea22f9", bodyColor: "#8e24aa", wingColor: "#d1c4e9", speedMult: 2.1, pts: 300, name: "سريعة" },
            TEAL: { color: "#00b0ff", bodyColor: "#00838f", wingColor: "#e0f7fa", speedMult: 1.2, pts: 200, name: "تيل" }
        };

        const LEVELS_ARRAY = [
            { num: 1, title: "المراعي الخضراء", targetDucks: 3, totalDucks: 5, duckSpeed: 2.5, coinTarget: 3, platformWidth: 1800, gapCount: 2, theme: LevelTheme.DAY },
            { num: 2, title: "بداية المغامرة", targetDucks: 4, totalDucks: 6, duckSpeed: 3.0, coinTarget: 5, platformWidth: 2400, gapCount: 3, theme: LevelTheme.DAY },
            { num: 3, title: "شروق نيوزلاندا", targetDucks: 4, totalDucks: 6, duckSpeed: 3.5, coinTarget: 6, platformWidth: 2605, gapCount: 4, theme: LevelTheme.SUNRISE },
            { num: 4, title: "الوديان الضبابية", targetDucks: 5, totalDucks: 8, duckSpeed: 4.0, coinTarget: 8, platformWidth: 3000, gapCount: 4, theme: LevelTheme.SUNRISE },
            { num: 5, title: "شمس النخبة", targetDucks: 5, totalDucks: 8, duckSpeed: 4.5, coinTarget: 10, platformWidth: 3200, gapCount: 5, theme: LevelTheme.SUNSET },
            { num: 6, title: "غروب دافيد", targetDucks: 6, totalDucks: 9, duckSpeed: 5.0, coinTarget: 12, platformWidth: 3500, gapCount: 5, theme: LevelTheme.SUNSET },
            { num: 7, title: "الشفق الساحر", targetDucks: 6, totalDucks: 9, duckSpeed: 5.5, coinTarget: 12, platformWidth: 3800, gapCount: 6, theme: LevelTheme.TWILIGHT },
            { num: 8, title: "السهول الغامضة", targetDucks: 7, totalDucks: 10, duckSpeed: 6.0, coinTarget: 15, platformWidth: 4000, gapCount: 6, theme: LevelTheme.TWILIGHT },
            { num: 9, title: "أضواء كوينزتاون", targetDucks: 7, totalDucks: 10, duckSpeed: 6.5, coinTarget: 15, platformWidth: 4200, gapCount: 7, theme: LevelTheme.TWILIGHT },
            { num: 10, title: "الأورورا السحرية", targetDucks: 8, totalDucks: 11, duckSpeed: 7.0, coinTarget: 18, platformWidth: 4500, gapCount: 7, theme: LevelTheme.AURORA },
            { num: 11, title: "التلال اللامعة", targetDucks: 8, totalDucks: 11, duckSpeed: 7.5, coinTarget: 20, platformWidth: 4800, gapCount: 8, theme: LevelTheme.AURORA },
            { num: 12, title: "العاصفة الخضراء", targetDucks: 9, totalDucks: 12, duckSpeed: 8.0, coinTarget: 22, platformWidth: 5000, gapCount: 8, theme: LevelTheme.AURORA },
            { num: 13, title: "تحدي الأبطال", targetDucks: 10, totalDucks: 14, duckSpeed: 8.5, coinTarget: 25, platformWidth: 5200, gapCount: 9, theme: LevelTheme.SUNSET },
            { num: 14, title: "مغامرة الصائد الكبير", targetDucks: 10, totalDucks: 14, duckSpeed: 9.0, coinTarget: 28, platformWidth: 5500, gapCount: 9, theme: LevelTheme.TWILIGHT },
            { num: 15, title: "أسطورة صيد البط", targetDucks: 12, totalDucks: 15, duckSpeed: 10.0, coinTarget: 30, platformWidth: 6000, gapCount: 10, theme: LevelTheme.AURORA }
        ];

        let unlockedLevels = [1];
        let activePhase = GamePhase.MENU;
        let selectedLevelNum = 1;
        let activeLevelConfig = LEVELS_ARRAY[0];

        // محاولة جلب وحفظ المستويات المفتوحة
        try {
            const saved = localStorage.getItem("game_unlocked_levels_v2");
            if (saved) unlockedLevels = JSON.parse(saved);
        } catch (e) { console.log(e); }

        let score = 0;
        let coinsCollectedCount = 0;
        let gameHearts = 3;
        let cameraX = 0;

        let player = {
            x: 100, y: 0, vx: 0, vy: 0, width: 44, height: 72,
            isGrounded: true, direction: "RIGHT", walkLegFrame: 0, muzzleFlashDuration: 0
        };

        let backgroundSheep = [];
        let platforms = [];
        let coinsList = [];
        let ducksList = [];
        let bulletsList = [];
        let particlesList = [];
        
        let flagpole = { x: 1000, y: 0, flagOffset: 0, isRisen: false };

        let keysPressed = { left: false, right: false, jump: false, shoot: false };

        let ducksSpawnersCount = 0;
        let ducksHitCount = 0;
        let huntActiveTimer = 0;
        let cloudFloatX = 0;

        /*******************************************************************************
         * بناء وتوليد مكونات المستوى برمجياً وتلقائياً لضمان سلاسة المساحات والعمل بدون فقدان بيانات
         *******************************************************************************/
        function initializeLevelConfig(levelNum) {
            activeLevelConfig = LEVELS_ARRAY.find(l => l.num === levelNum) || LEVELS_ARRAY[0];
            selectedLevelNum = activeLevelConfig.num;
            
            cameraX = 0;
            coinsCollectedCount = 0;
            gameHearts = 3;
            ducksHitCount = 0;
            ducksSpawnersCount = 0;
            
            platforms = [];
            let currentX = 0;

            platforms.push({ left: 0, top: 120, right: 350, isGap: false });
            currentX = 350;

            let gapCreated = 0;
            while (currentX < activeLevelConfig.platformWidth - 300) {
                const createGap = (Math.random() > 0.6 && gapCreated < activeLevelConfig.gapCount && currentX > 500);
                const width = 120 + Math.random() * 250;
                
                if (createGap) {
                    const gapWidth = 110 + Math.random() * 50;
                    platforms.push({ left: currentX, top: 120, right: currentX + gapWidth, isGap: true });
                    currentX += gapWidth;
                    gapCreated++;
                } else {
                    const heightOffset = 100 + Math.floor(Math.random() * 3) * 50;
                    platforms.push({ left: currentX, top: heightOffset, right: currentX + width, isGap: false });
                    currentX += width;
                }
            }

            flagpole.x = activeLevelConfig.platformWidth - 180;
            flagpole.isRisen = false;
            flagpole.flagOffset = 0;
            platforms.push({ left: currentX, top: 120, right: activeLevelConfig.platformWidth + 500, isGap: false });

            // توليد قطع الذهب العشوائية
            coinsList = [];
            let coinIdSeq = 0;
            platforms.forEach(p => {
                if (!p.isGap) {
                    const length = p.right - p.left;
                    const possibleCoinsCount = Math.floor(length / 90);
                    for (let i = 1; i < possibleCoinsCount; i++) {
                        const isChest = (Math.random() > 0.88);
                        coinsList.push({
                            id: coinIdSeq++,
                            x: p.left + (i * 90),
                            y: p.top + 30 + (isChest ? 0 : Math.random() * 40),
                            isCollected: false,
                            isChest: isChest
                        });
                    }
                }
            });

            // توليد حيوانات مبهجة متناثرة في الخلفية البيئية لنيوزيلندا بشكل جمالي ومعماري ممتاز
            backgroundSheep = [];
            for (let i = 0; i < 8; i++) {
                backgroundSheep.push({
                    x: 180 + Math.random() * (activeLevelConfig.platformWidth - 400),
                    y: 80 + Math.random() * 30,
                    scaleX: Math.random() > 0.5 ? 1 : -1
                });
            }

            player.x = 80;
            player.y = 120;
            player.vx = 0;
            player.vy = 0;
            player.isGrounded = false;
            player.direction = "RIGHT";

            bulletsList = [];
            particlesList = [];
            ducksList = [];
        }

        /*******************************************************************************
         * تحديثات واختبارات حركة اللاعب الحسابية وعقبات المنصات
         *******************************************************************************/
        function handlePlayerPhysics() {
            if (keysPressed.left) {
                player.vx = -5.8;
                player.direction = "LEFT";
                player.walkLegFrame += 0.25;
            } else if (keysPressed.right) {
                player.vx = 5.8;
                player.direction = "RIGHT";
                player.walkLegFrame += 0.25;
            } else {
                player.vx *= 0.65;
            }

            if (keysPressed.jump && player.isGrounded) {
                player.vy = 14.5;
                player.isGrounded = false;
                sound.playJump();
            }

            player.vy -= 0.62; // الجاذبية الأرضية
            if (player.vy < -18) player.vy = -18;

            player.x += player.vx;
            player.y += player.vy;

            if (player.x < 15) player.x = 15;
            if (player.x > activeLevelConfig.platformWidth) player.x = activeLevelConfig.platformWidth;

            let wasCollided = false;
            for (let p of platforms) {
                if (player.x >= p.left && player.x <= p.right && !p.isGap) {
                    if (player.y <= p.top && (player.y - player.vy) >= p.top - 20) {
                        player.y = p.top;
                        player.vy = 0;
                        player.isGrounded = true;
                        wasCollided = true;
                        break;
                    }
                }
            }

            if (!wasCollided) player.isGrounded = false;

            // السقوط في الهاوية
            if (player.y < -120) {
                gameHearts--;
                sound.playFail();
                if (gameHearts <= 0) {
                    activePhase = GamePhase.FAILED;
                } else {
                    player.x = Math.max(80, player.x - 200);
                    player.y = 200;
                    player.vy = 0;
                }
            }

            // التقاط العملات وصناديق الذهب الكبرى
            coinsList.forEach(c => {
                if (!c.isCollected) {
                    const dx = player.x - c.x;
                    const dy = (player.y + 35) - c.y;
                    const distCheck = Math.sqrt(dx*dx + dy*dy);
                    if (distCheck < 45) {
                        c.isCollected = true;
                        if (c.isChest) {
                            coinsCollectedCount += 5;
                            score += 50;
                            sound.playExplosion();
                            for (let idx = 0; idx < 10; idx++) {
                                particlesList.push({
                                    x: c.x, y: c.y,
                                    vx: (Math.random() - 0.5) * 6, vy: 3 + Math.random() * 6,
                                    color: "#ffd54f", size: 4 + Math.random() * 4, age: 0, maxAge: 35
                                });
                            }
                        } else {
                            coinsCollectedCount++;
                            score += 10;
                            sound.playCoin();
                        }
                    }
                }
            });

            // لحاق الكاميرا الذكية باللاعب بسلاسة مريحة للعينين
            const targetCamX = player.x - screenWidth * 0.35;
            cameraX += (targetCamX - cameraX) * 0.08;
            if (cameraX < 0) cameraX = 0;
            const maxCamX = activeLevelConfig.platformWidth - screenWidth * 0.9;
            if (cameraX > maxCamX) cameraX = maxCamX;

            // لمس علم الوصول بنجاح للمستوى
            if (player.x >= flagpole.x - 30 && activePhase === GamePhase.PLATFORMER) {
                activePhase = GamePhase.FLAG_TRANSITION;
                sound.playSuccess();
                flagpole.isRisen = true;
            }
        }

        /*******************************************************************************
         * محاكاة وطور صيد البط (The NZ Water Fowls Hunt Phase)
         *******************************************************************************/
        function summonFlyingDuck() {
            if (ducksSpawnersCount >= activeLevelConfig.totalDucks) return;
            ducksSpawnersCount++;
            
            let roll = Math.random();
            let dType = DuckType.MALLARD;
            if (roll > 0.9) dType = DuckType.GOLDEN;
            else if (roll > 0.75) dType = DuckType.SWIFT;
            else if (roll > 0.55) dType = DuckType.TEAL;

            const fromLeft = Math.random() > 0.5;
            const startX = fromLeft ? -50 : screenWidth + 50;
            const targetY = 150 + Math.random() * 250;
            const rawSpeed = activeLevelConfig.duckSpeed * dType.speedMult;
            const vxVec = fromLeft ? rawSpeed : -rawSpeed;

            ducksList.push({
                x: startX, y: targetY, vx: vxVec, vy: 0, width: 64, height: 48,
                type: dType, isHit: false, fallVelocity: 0, flapClock: Math.random() * 10, ageTicks: 0
            });
        }

        function handleHuntingDynamics() {
            huntActiveTimer++;
            
            if (ducksList.filter(d => !d.isHit).length < 2 && ducksSpawnersCount < activeLevelConfig.totalDucks) {
                if (Math.random() > 0.95) summonFlyingDuck();
            }

            ducksList.forEach(d => {
                d.ageTicks++;
                d.flapClock += 0.3;

                if (!d.isHit) {
                    if (d.type === DuckType.TEAL) {
                        d.vy = Math.sin(d.ageTicks * 0.08) * 3;
                    } else {
                        d.vy = (Math.random() - 0.5) * 1.5;
                    }
                    d.x += d.vx;
                    d.y += d.vy;

                    // في حالة هروب البطة خارج الشاشة
                    if ((d.vx > 0 && d.x > screenWidth + 100) || (d.vx < 0 && d.x < -100)) {
                        d.isHit = true; 
                        checkEndHuntingStatus();
                    }
                } else {
                    d.fallVelocity += 0.7;
                    d.y -= d.fallVelocity;
                    d.x += d.vx * 0.1;
                    
                    if (d.y <= 130) {
                        for (let s = 0; s < 5; s++) {
                            particlesList.push({
                                x: d.x, y: d.y,
                                vx: (Math.random() - 0.5) * 4, vy: 2 + Math.random() * 3,
                                color: "#3e2723", size: 3, age: 0, maxAge: 20
                            });
                        }
                        const index = ducksList.indexOf(d);
                        if (index > -1) ducksList.splice(index, 1);
                        checkEndHuntingStatus();
                    }
                }
            });
        }

        function clickPerformHuntingShot(canvasX, canvasY) {
            if (activePhase !== GamePhase.HUNTING) return;
            
            sound.playShoot();
            
            for (let i = 0; i < 7; i++) {
                particlesList.push({
                    x: canvasX, y: canvasY,
                    vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                    color: "#ffca28", size: 3 + Math.random() * 3, age: 0, maxAge: 15
                });
            }

            ducksList.forEach(d => {
                if (!d.isHit) {
                    const dx = canvasX - d.x;
                    const dy = canvasY - d.y;
                    const range = Math.sqrt(dx*dx + dy*dy);
                    if (range <= 45) {
                        d.isHit = true;
                        d.fallVelocity = -5.0;
                        ducksHitCount++;
                        score += d.type.pts;
                        sound.playExplosion();

                        for (let f = 0; f < 14; f++) {
                            particlesList.push({
                                x: d.x, y: d.y,
                                vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
                                color: d.type.color, size: 3 + Math.random() * 4, age: 0, maxAge: 30
                            });
                        }
                    }
                }
            });
        }

        function checkEndHuntingStatus() {
            const remainingSpawns = activeLevelConfig.totalDucks - ducksSpawnersCount;
            const remainingOnScreen = ducksList.filter(d => !d.isHit).length;

            if (remainingSpawns <= 0 && remainingOnScreen <= 0) {
                if (ducksHitCount >= activeLevelConfig.targetDucks) {
                    activePhase = GamePhase.SUCCESS;
                    sound.playSuccess();
                    const nextLv = activeLevelConfig.num + 1;
                    if (!unlockedLevels.includes(nextLv) && nextLv <= 15) {
                        unlockedLevels.push(nextLv);
                        try {
                            localStorage.setItem("game_unlocked_levels_v2", JSON.stringify(unlockedLevels));
                        } catch(e){}
                    }
                } else {
                    activePhase = GamePhase.FAILED;
                    sound.playFail();
                }
            }
        }

        /*******************************************************************************
         * محرك رسم الفيكتور المتكامل للتصميم والبيئة وسماء نيوزيلاندا المتنوعة
         *******************************************************************************/
        function renderSkyBackground(themeArg) {
            let skyGrad = ctx.createLinearGradient(0, 0, 0, screenHeight);
            
            switch (themeArg) {
                case LevelTheme.DAY:
                    skyGrad.addColorStop(0, "#4fc3f7");
                    skyGrad.addColorStop(1, "#e1f5fe");
                    break;
                case LevelTheme.SUNRISE:
                    skyGrad.addColorStop(0, "#f8bbd0");
                    skyGrad.addColorStop(0.5, "#bbdefb");
                    skyGrad.addColorStop(1, "#fff9c4");
                    break;
                case LevelTheme.SUNSET:
                    skyGrad.addColorStop(0, "#ff7043");
                    skyGrad.addColorStop(0.6, "#d84315");
                    skyGrad.addColorStop(1, "#4a148c");
                    break;
                case LevelTheme.TWILIGHT:
                    skyGrad.addColorStop(0, "#0d1b2a");
                    skyGrad.addColorStop(0.7, "#1b263b");
                    skyGrad.addColorStop(1, "#415a77");
                    break;
                case LevelTheme.AURORA:
                    skyGrad.addColorStop(0, "#051610");
                    skyGrad.addColorStop(0.5, "#0b3c20");
                    skyGrad.addColorStop(1, "#1c122c");
                    break;
            }

            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, screenWidth, screenHeight);

            if (themeArg === LevelTheme.TWILIGHT || themeArg === LevelTheme.AURORA) {
                ctx.fillStyle = "#ffffff";
                for (let s = 0; s < 15; s++) {
                    const sx = (s * 67) % screenWidth;
                    const sy = (s * 41) % 180;
                    ctx.beginPath();
                    ctx.arc(sx, sy, Math.sin(cloudFloatX * 0.05 + s) * 1.5 + 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = "#faf3c0";
                ctx.beginPath();
                ctx.arc(800, 100, 35, 0, Math.PI * 2);
                ctx.fill();
            }

            // رسم السحب العائمة
            ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
            for (let i = 0; i < 4; i++) {
                const cx = ((cloudFloatX + i * 320) % (screenWidth + 250)) - 150;
                const cy = 60 + (i * 15);
                ctx.beginPath();
                ctx.arc(cx, cy, 20, 0, Math.PI * 2);
                ctx.arc(cx + 30, cy - 8, 26, 0, Math.PI * 2);
                ctx.arc(cx + 60, cy, 20, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawParallaxSlopes(camXOffset, theme) {
            let slopeColor1, slopeColor2;
            switch (theme) {
                case LevelTheme.DAY: slopeColor1 = "#81c784"; slopeColor2 = "#4caf50"; break;
                case LevelTheme.SUNRISE: slopeColor1 = "#bcd59a"; slopeColor2 = "#859a5d"; break;
                case LevelTheme.SUNSET: slopeColor1 = "#7e57c2"; slopeColor2 = "#5e35b1"; break;
                case LevelTheme.TWILIGHT: slopeColor1 = "#34495e"; slopeColor2 = "#2c3e50"; break;
                case LevelTheme.AURORA: slopeColor1 = "#004d40"; slopeColor2 = "#00332c"; break;
            }

            ctx.fillStyle = slopeColor1;
            ctx.beginPath();
            ctx.moveTo(0, screenHeight);
            for (let x = 0; x <= screenWidth; x += 50) {
                const virtualX = x + camXOffset * 0.25;
                const y = 200 + Math.sin(virtualX * 0.003) * 50;
                ctx.lineTo(x, screenHeight - y);
            }
            ctx.lineTo(screenWidth, screenHeight);
            ctx.fill();

            ctx.fillStyle = slopeColor2;
            ctx.beginPath();
            ctx.moveTo(0, screenHeight);
            for (let x = 0; x <= screenWidth; x += 50) {
                const virtualX = x + camXOffset * 0.55;
                const y = 140 + Math.cos(virtualX * 0.005) * 40;
                ctx.lineTo(x, screenHeight - y);
            }
            ctx.lineTo(screenWidth, screenHeight);
            ctx.fill();
        }

        function drawPlatformSegments(camXOffset) {
            platforms.forEach(p => {
                if (p.isGap) return;
                const drawLeft = p.left - camXOffset;
                const drawRight = p.right - camXOffset;
                if (drawRight < -50 || drawLeft > screenWidth + 50) return;

                const topY = screenHeight - p.top;
                const height = 150;

                ctx.fillStyle = "#388e3c";
                ctx.fillRect(drawLeft, topY, p.right - p.left, 15);

                ctx.fillStyle = "#8d6e63";
                ctx.fillRect(drawLeft, topY + 15, p.right - p.left, height);

                ctx.strokeStyle = "rgba(0,0,0,0.18)";
                ctx.lineWidth = 3;
                for (let rx = p.left; rx < p.right; rx += 70) {
                    const drawRx = rx - camXOffset;
                    ctx.beginPath();
                    ctx.moveTo(drawRx, topY + 15);
                    ctx.lineTo(drawRx, topY + 80);
                    ctx.stroke();
                }

                ctx.strokeStyle = "#5d4037";
                ctx.lineWidth = 4;
                ctx.strokeRect(drawLeft, topY + 15, p.right - p.left, height);
            });
        }

        function drawCuteSheep(camXOffset) {
            backgroundSheep.forEach(s => {
                const drawX = s.x - camXOffset;
                if (drawX < -150 || drawX > screenWidth + 150) return;
                const shY = screenHeight - s.y;

                ctx.save();
                ctx.translate(drawX, shY);
                ctx.scale(s.scaleX, 1);

                ctx.fillStyle = "#eceff1";
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.arc(-8, -4, 11, 0, Math.PI * 2);
                ctx.arc(8, -2, 11, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#1e1e1e";
                ctx.beginPath();
                ctx.arc(14, -2, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "#1e1e1e";
                ctx.lineWidth = 3;
                
                const legSwing = Math.sin(cloudFloatX * 0.1) * 3;
                ctx.beginPath();
                ctx.moveTo(-6, 10); ctx.lineTo(-6 + legSwing, 20);
                ctx.moveTo(3, 10); ctx.lineTo(3 - legSwing, 20);
                ctx.stroke();

                ctx.restore();
            });
        }

        function drawGoalFlag(camXOffset) {
            const drawX = flagpole.x - camXOffset;
            const floorY = screenHeight - 120;
            
            ctx.strokeStyle = "#90a4ae";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(drawX, floorY);
            ctx.lineTo(drawX, floorY - 220);
            ctx.stroke();

            ctx.fillStyle = "#ffd54f";
            ctx.beginPath();
            ctx.arc(drawX, floorY - 225, 7, 0, Math.PI*2);
            ctx.fill();

            if (flagpole.isRisen && flagpole.flagOffset < 160) {
                flagpole.flagOffset += 3.5;
            }

            const flagY = floorY - 50 - flagpole.flagOffset;
            ctx.fillStyle = "#e53935";
            ctx.beginPath();
            ctx.moveTo(drawX, flagY);
            ctx.lineTo(drawX - 50, flagY + 20);
            ctx.lineTo(drawX, flagY + 40);
            ctx.closePath();
            ctx.fill();
        }

        function drawCoinsAndGems(camXOffset) {
            coinsList.forEach(c => {
                if (c.isCollected) return;
                const drawX = c.x - camXOffset;
                if (drawX < -32 || drawX > screenWidth + 32) return;
                const drawY = screenHeight - c.y;

                if (c.isChest) {
                    ctx.fillStyle = "#ffb300";
                    ctx.strokeStyle = "#ff6f00";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.rect(drawX - 20, drawY - 14, 40, 28);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = "#bdc3c7";
                    ctx.fillRect(drawX - 6, drawY - 6, 12, 12);
                } else {
                    ctx.fillStyle = "#ffd54f";
                    ctx.strokeStyle = "#ffb300";
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, 12, 0, Math.PI*2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = "#fff9c4";
                    ctx.beginPath();
                    ctx.arc(drawX - 3, drawY - 3, 4, 0, Math.PI*2);
                    ctx.fill();
                }
            });
        }

        function drawTheDuckHunterPlayer(camXOffset) {
            const drawX = player.x - camXOffset;
            const drawY = screenHeight - player.y - player.height;

            ctx.save();
            ctx.translate(drawX + player.width/2, drawY + player.height/2);
            if (player.direction === "LEFT") ctx.scale(-1, 1);

            // ساق الصائد
            ctx.strokeStyle = "#3e2723";
            ctx.lineWidth = 5;
            const waveOffset = Math.sin(player.walkLegFrame) * 8;
            ctx.beginPath();
            ctx.moveTo(-10, 15); ctx.lineTo(-10 + waveOffset, 36);
            ctx.moveTo(10, 15); ctx.lineTo(10 - waveOffset, 36);
            ctx.stroke();

            // ملابس الصياد الخضراء الكلاسيكية الممتازة
            ctx.fillStyle = "#1b5e20";
            ctx.beginPath();
            ctx.roundRect(-20, -15, 40, 32, 10);
            ctx.fill();

            // حزام الصياد وجيب الذخائر
            ctx.fillStyle = "#263238";
            ctx.fillRect(-21, 5, 42, 6);

            // رأس ووجه الصياد
            ctx.fillStyle = "#ffe0b2";
            ctx.beginPath();
            ctx.arc(0, -25, 12, 0, Math.PI*2);
            ctx.fill();

            // قبعة صيد البط الشهيرة
            ctx.fillStyle = "#4e342e";
            ctx.beginPath();
            ctx.ellipse(0, -32, 16, 7, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#5d4037";
            ctx.beginPath();
            ctx.arc(0, -35, 10, Math.PI, 0);
            ctx.fill();

            // بندقية الصياد (The Hunting Rifle)
            ctx.strokeStyle = "#37474f";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(10, -5); ctx.lineTo(34, -5);
            ctx.stroke();
            ctx.strokeStyle = "#5d4037"; // المقبض الخشبي
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(0, -2); ctx.lineTo(12, -5);
            ctx.stroke();

            // وميض طلق النار
            if (player.muzzleFlashDuration > 0) {
                player.muzzleFlashDuration--;
                ctx.fillStyle = "#ffb300";
                ctx.beginPath();
                ctx.arc(38, -5, 12, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#fff9c4";
                ctx.beginPath();
                ctx.arc(38, -5, 6, 0, Math.PI*2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawActiveDucks() {
            ducksList.forEach(d => {
                ctx.save();
                ctx.translate(d.x, d.y);
                if (d.vx < 0) ctx.scale(-1, 1);

                if (d.isHit) {
                    ctx.rotate(Math.sin(d.ageTicks * 0.2) * 0.8);
                }

                // رسم جسم البطة
                ctx.fillStyle = d.type.bodyColor;
                ctx.beginPath();
                ctx.ellipse(0, 0, 26, 18, 0, 0, Math.PI*2);
                ctx.fill();

                // جناح البطة (حركة الرفرفة التلقائية)
                ctx.fillStyle = d.type.wingColor;
                ctx.save();
                const flapOffset = Math.sin(d.flapClock) * 14;
                ctx.translate(-5, -2);
                ctx.beginPath();
                ctx.ellipse(0, 0, 10, 16 + flapOffset, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();

                // الرقبة ورأس البطة الملون
                ctx.fillStyle = d.type.color;
                ctx.beginPath();
                ctx.arc(18, -14, 11, 0, Math.PI*2);
                ctx.fill();

                // منقار البطة الأصفر
                ctx.fillStyle = "#ffeb3b";
                ctx.beginPath();
                ctx.moveTo(26, -16);
                ctx.lineTo(38, -12);
                ctx.lineTo(26, -8);
                ctx.closePath();
                ctx.fill();

                // عين البطة الصغيرة
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(16, -16, 2.5, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(16, -16, 1.2, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            });
        }

        function drawSparksAndDust() {
            particlesList.forEach(p => {
                p.age++;
                p.x += p.vx;
                p.y += p.vy;
                p.vy *= 0.98;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, screenHeight - p.y, p.size * (1 - p.age / p.maxAge), 0, Math.PI*2);
                ctx.fill();
            });
            particlesList = particlesList.filter(p => p.age < p.maxAge);
        }

        /*******************************************************************************
         * الواجهات الرسومية الجذابة (الرئيسية، شاشة الفوز، شاشة الخسارة)
         *******************************************************************************/
        function drawTheFullHUD() {
            // شريط الإحصائيات العلوي المصمم باحترافية
            ctx.fillStyle = "rgba(10, 10, 10, 0.72)";
            ctx.fillRect(0, 0, screenWidth, 64);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px 'Segoe UI', Tahoma";
            ctx.textAlign = "right";

            // اسم المستوى النشط
            ctx.fillStyle = varColorOfTheme(activeLevelConfig.theme);
            ctx.fillText(`المستوى ${activeLevelConfig.num}: ${activeLevelConfig.title}`, screenWidth - 24, 38);

            // النقاط والعملات الذهبية
            ctx.fillStyle = "#ffd54f";
            ctx.fillText(`✨ النقاط: ${score}`, screenWidth - 380, 38);
            ctx.fillText(`🪙 العملات: ${coinsCollectedCount}/${activeLevelConfig.coinTarget}`, screenWidth - 560, 38);

            // القلوب والحياة المتوفرة
            ctx.fillStyle = "#ef5350";
            let heartString = "";
            for (let h = 0; h < gameHearts; h++) heartString += "❤️ ";
            ctx.fillText(heartString, screenWidth - 720, 38);

            if (activePhase === GamePhase.HUNTING) {
                ctx.fillStyle = "#2196f3";
                ctx.fillText(`🎯 أهداف الصيد: ${ducksHitCount}/${activeLevelConfig.targetDucks}`, screenWidth - 850, 38);
            }
        }

        function varColorOfTheme(theme) {
            if (theme === LevelTheme.DAY) return "#4caf50";
            if (theme === LevelTheme.SUNRISE) return "#e91e63";
            if (theme === LevelTheme.SUNSET) return "#ff9800";
            if (theme === LevelTheme.TWILIGHT) return "#3f51b5";
            return "#00e676";
        }

        // رسم واجهة القائمة الرئيسية
        function renderMenuHUD() {
            ctx.fillStyle = "rgba(10, 10, 10, 0.82)";
            ctx.fillRect(0, 0, screenWidth, screenHeight);

            // العنوان الرئيسي المبهج للعبة
            ctx.fillStyle = "#ffb300";
            ctx.font = "bold 44px 'Segoe UI', Tahoma";
            ctx.textAlign = "center";
            ctx.fillText("منصة صيد البط للألعاب الفائقة", screenWidth / 2, 90);

            ctx.fillStyle = "#eceff1";
            ctx.font = "18px 'Segoe UI'";
            ctx.fillText("اختر المستوى لبدء المغامرة مباشرة من متصفحك أو هاتفك:", screenWidth / 2, 135);

            // رسم قائمة المستويات الـ 15 الموزعة بذكاء ومربعات تفاعلية
            const boxW = 160;
            const boxH = 75;
            const startX = 64;
            const startY = 170;
            const gap = 24;

            for (let i = 0; i < 15; i++) {
                const lvNum = i + 1;
                const r = Math.floor(i / 5);
                const c = i % 5;
                const bx = startX + c * (boxW + gap);
                const by = startY + r * (boxH + gap);

                const isUnlocked = unlockedLevels.includes(lvNum);

                if (isUnlocked) {
                    ctx.fillStyle = "#2e7d32";
                    ctx.strokeStyle = "#ffb300";
                } else {
                    ctx.fillStyle = "#37474f";
                    ctx.strokeStyle = "#263238";
                }

                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(bx, by, boxW, boxH, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px 'Segoe UI'";
                ctx.fillText(`المستوى ${lvNum}`, bx + boxW / 2, by + 34);

                ctx.font = "11px 'Segoe UI'";
                if (isUnlocked) {
                    ctx.fillStyle = "#ffd54f";
                    ctx.fillText("مفتوح للعب 🔓", bx + boxW / 2, by + 58);
                } else {
                    ctx.fillStyle = "#90a4ae";
                    ctx.fillText("مغلق 🔒", bx + boxW / 2, by + 58);
                }
            }
        }

        // شاشات الفوز والخسارة والنهاية
        function renderStatusOverlay(statusTitle, statusDesc, btnText) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, screenWidth, screenHeight);

            ctx.fillStyle = statusTitle.includes("تم") ? "#4caf50" : "#ef5350";
            ctx.font = "bold 46px 'Segoe UI', Tahoma";
            ctx.textAlign = "center";
            ctx.fillText(statusTitle, screenWidth/2, 220);

            ctx.fillStyle = "#eceff1";
            ctx.font = "20px 'Segoe UI'";
            ctx.fillText(statusDesc, screenWidth/2, 290);

            ctx.fillStyle = "#4caf50";
            ctx.beginPath();
            ctx.roundRect(screenWidth/2 - 120, 350, 240, 56, 12);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px 'Segoe UI'";
            ctx.fillText(btnText, screenWidth/2, 385);
        }

        /*******************************************************************************
         * دورة ونواة التحديث الشامل للعبة ومحرك الأنيميشن الأساسي
         *******************************************************************************/
        function processNextFrame() {
            cloudFloatX += 0.8;

            if (activePhase === GamePhase.MENU) {
                renderSkyBackground(LevelTheme.TWILIGHT);
                renderMenuHUD();
            } else if (activePhase === GamePhase.PLATFORMER || activePhase === GamePhase.FLAG_TRANSITION) {
                renderSkyBackground(activeLevelConfig.theme);
                drawParallaxSlopes(cameraX, activeLevelConfig.theme);
                drawPlatformSegments(cameraX);
                drawCuteSheep(cameraX);
                drawCoinsAndGems(cameraX);
                drawGoalFlag(cameraX);
                drawTheDuckHunterPlayer(cameraX);
                drawSparksAndDust();
                
                handlePlayerPhysics();
                drawTheFullHUD();

                if (activePhase === GamePhase.FLAG_TRANSITION && flagpole.flagOffset >= 150) {
                    activePhase = GamePhase.HUNTING;
                    sound.playSuccess();
                }
            } else if (activePhase === GamePhase.HUNTING) {
                renderSkyBackground(activeLevelConfig.theme);
                drawParallaxSlopes(0, activeLevelConfig.theme);
                drawCuteSheep(0);
                drawActiveDucks();
                drawSparksAndDust();

                handleHuntingDynamics();
                drawTheFullHUD();
                
                // توجيه المستخدم بالصيد
                ctx.fillStyle = "rgba(255,255,255,0.85)";
                ctx.font = "bold 20px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("اضغط أو المس السبطانة لضرب وإصابة الطيور الطليقة! 🎯", screenWidth/2, 100);
            } else if (activePhase === GamePhase.SUCCESS) {
                renderStatusOverlay("تم بنجاح! طيران بط مذهل تم اصطياده 🎉", `يسعدنا فوزك وسقوط البط المطلوب بنجاح! نقاطك الحالية: ${score}`, "المستوى التالي ➡");
            } else if (activePhase === GamePhase.FAILED) {
                renderStatusOverlay("يا للأسف، لقد فشلت في الصيد 💀", "إما بسقوطك المتكرر أو عدم مقدرتك على تحقيق هدف البط الكافي لتخطي المرحلة.", "إعادة المحاولة 🔄");
            }

            requestAnimationFrame(processNextFrame);
        }

        /*******************************************************************************
         * إدارة وضبط مدخلات ومستشعرات اللمس وأزرار الهاتف والكمبيوتر
         *******************************************************************************/
        window.addEventListener("keydown", e => {
            sound.init();
            if (e.key === "ArrowLeft" || e.key === "a") keysPressed.left = true;
            if (e.key === "ArrowRight" || e.key === "d") keysPressed.right = true;
            if (e.key === "ArrowUp" || e.key === "w" || e.key === "Space" || e.key === " ") keysPressed.jump = true;
        });

        window.addEventListener("keyup", e => {
            if (e.key === "ArrowLeft" || e.key === "a") keysPressed.left = false;
            if (e.key === "ArrowRight" || e.key === "d") keysPressed.right = false;
            if (e.key === "ArrowUp" || e.key === "w" || e.key === "Space" || e.key === " ") keysPressed.jump = false;
        });

        // إدارة إحداثيات اللمس والضغط التفاعلي بالقائمة والغابة
        function handlePointerInputTrigger(cx, cy) {
            sound.init();
            
            if (activePhase === GamePhase.MENU) {
                const boxW = 160;
                const boxH = 75;
                const startX = 64;
                const startY = 170;
                const gap = 24;

                for (let i = 0; i < 15; i++) {
                    const r = Math.floor(i / 5);
                    const c = i % 5;
                    const bx = startX + c * (boxW + gap);
                    const by = startY + r * (boxH + gap);

                    if (cx >= bx && cx <= bx + boxW && cy >= by && cy <= by + boxH) {
                        const targetLv = i + 1;
                        if (unlockedLevels.includes(targetLv)) {
                            initializeLevelConfig(targetLv);
                            activePhase = GamePhase.PLATFORMER;
                            sound.playSuccess();
                        }
                    }
                }
            } else if (activePhase === GamePhase.HUNTING) {
                clickPerformHuntingShot(cx, cy);
            } else if (activePhase === GamePhase.SUCCESS) {
                if (cx >= screenWidth/2 - 120 && cx <= screenWidth/2 + 120 && cy >= 350 && cy <= 406) {
                    const nextLv = selectedLevelNum + 1;
                    if (nextLv <= 15) {
                        initializeLevelConfig(nextLv);
                        activePhase = GamePhase.PLATFORMER;
                    } else {
                        activePhase = GamePhase.MENU;
                    }
                }
            } else if (activePhase === GamePhase.FAILED) {
                if (cx >= screenWidth/2 - 120 && cx <= screenWidth/2 + 120 && cy >= 350 && cy <= 406) {
                    initializeLevelConfig(selectedLevelNum);
                    activePhase = GamePhase.PLATFORMER;
                }
            }
        }

        // تفاعلات الماوس العادي
        canvas.addEventListener("mousedown", e => {
            const rect = canvas.getBoundingClientRect();
            const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
            handlePointerInputTrigger(cx, cy);
        });

        // تفاعلات الشاشات الذكية
        canvas.addEventListener("touchstart", e => {
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                const cx = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
                const cy = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
                handlePointerInputTrigger(cx, cy);
            }
        });

        // ربط أزرار اللمس على الجوال بمتغيرات اللعبة
        document.getElementById("btn-left").addEventListener("touchstart", () => { keysPressed.left = true; });
        document.getElementById("btn-left").addEventListener("touchend", () => { keysPressed.left = false; });
        document.getElementById("btn-right").addEventListener("touchstart", () => { keysPressed.right = true; });
        document.getElementById("btn-right").addEventListener("touchend", () => { keysPressed.right = false; });
        document.getElementById("btn-jump").addEventListener("touchstart", () => { keysPressed.jump = true; });
        document.getElementById("btn-jump").addEventListener("touchend", () => { keysPressed.jump = false; });

        // تشغيل اللعبة بصورة تلقائية
        processNextFrame();
    </script>
</body>
</html>
